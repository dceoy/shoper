[project]
name = "shoper"
version = "1.4.4"
description = "Simple shell operator module"
authors = [{name = "Daichi Narushima", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "Daichi Narushima", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.10"
dependencies = []
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells"
]


[project.urls]
Repository = "https://github.com/dceoy/shoper.git"

[dependency-groups]
dev = [
  "ruff >=0.14.0,<0.17.0",
  "pyright >= 1.1.379",
  "pytest >= 8.3.2",
  "pytest-mock >= 3.14.0",
  "pytest-cov >=7,<8",
  "pytest-xdist >= 3.6.1",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",  # flake8-copyright (CPY)
  "RET",  # flake8-return (RET)
  "COM812",   # missing-trailing-comma
  "FA100",    # future-rewritable-type-annotation
  "FBT001",   # boolean-type-hint-positional-argument
  "FBT002",   # boolean-default-value-positional-argument
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "D104",     # undocumented-public-package
]
"test/**.py" = [
  "D101",     # undocumented-public-class
  "D102",     # undocumented-public-method
  "D103",     # undocumented-public-function
  "S101",     # assert
  "S104",     # hardcoded-bind-all-interfaces
  "PLC2701",  # import-private-name
  "SLF001",   # private-member-access
]

[tool.pyright]
typeCheckingMode = "strict"
exclude = ["build", ".venv"]
threads = 0

[tool.pytest.ini_options]
addopts = [
  "--cov=shoper",
  "--cov-branch",
  "--doctest-modules",
  "--capture=no",
  "--numprocesses=auto",
]
pythonpaths = ["."]
testpaths = ["test/unit"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"

[tool.coverage.run]
source = ["shoper"]
omit = ["test/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
